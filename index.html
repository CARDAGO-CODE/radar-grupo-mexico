"Integración operativa y tecnológica de activos en SAAVI", "Podemos acompañar la migración de activos de Grupo México a SAAVI mediante la integración de las operaciones y los ajustes tecnológicos y de control necesarios para el reporte a GMXI (Grupo México Infraestructura). La oportunidad es definir un modelo de integración que dé visibilidad a la dirección sobre la operación y sus riesgos.", "Risk; Technology", "CEO SAAVI, CIO SAAVI", "Alto >1M", "Omar Martínez / Marcos Canales", "GMXI: Grupo México Infraestructura.", "IMG_1645.HEIC (izquierda); IMG_1646.HEIC (izquierda, bajo rótulo Infraestructura)"], ["INF-02", "Infraestructura", "Acompañamiento recurrente de adquisiciones y expansión en Latinoamérica", "Proponemos un servicio de acompañamiento en fusiones y adquisiciones que cubra el análisis de oportunidades, la entrada a nuevos mercados, la ejecución de transacciones y la integración posterior. EY puede apoyar a Grupo México a lo largo del ciclo de inversión para dar continuidad a su agenda de crecimiento en Latinoamérica.", "Strategy & Transformation; Transactions", "GM[?]", "Alto >1M", "Pablo Sola / Aleix González / Guillermo Medina", "Confirmar sigla del Buyer.", "IMG_1645.HEIC (derecha); IMG_1646.HEIC (derecha, bajo rótulo Infraestructura)"], ["TRV-01", "Transversal", "Optimización de la elaboración y gestión de contratos", "Podemos acompañar a las áreas Legal y de Transformación en el diseño de un modelo más eficiente para elaborar y dar seguimiento a los contratos. La oportunidad es estandarizar el proceso y mejorar la visibilidad sobre compromisos contractuales, con mayor coordinación entre las áreas involucradas.", "Legal & Investigations", "Legal y/o área innovación / transformación", "Medio 250K–1M", "Carina Barrera", "“Transversal” anotado en la tarjeta y confirmado por el rótulo del tablero.", "IMG_1640.HEIC (izquierda); IMG_1647.HEIC (fila Transversal, primera)"], ["TRV-02", "Transversal", "Simplificación de la estructura de entidades legales", "Proponemos revisar el portafolio de entidades legales para identificar sociedades en desuso o cuya permanencia deba reevaluarse. EY puede integrar el análisis legal y fiscal para definir alternativas de simplificación que permitan reducir la carga administrativa y los costos de gestión.", "Tax; Legal & Investigations", "CEO / CFO", "Sin marcar", "Carina Barrera; Alonso Díaz Barriga", "Nota superior: “Pilar 3 – mayormente en Minería e ... [?]”. Confirmar final de nota. Valor sin marcar.", "IMG_1640.HEIC (derecha); IMG_1647.HEIC (fila Transversal, segunda)"], ["TRV-03", "Infraestructura", "Servicios administrados de impuestos, finanzas, nómina y Recursos Humanos", "Podemos explorar con la Dirección de Finanzas un modelo de servicios administrados que articule la operación de impuestos y finanzas con la nómina multipaís y los procesos de Recursos Humanos. La oportunidad es definir un alcance integrado que facilite la estandarización y una operación más eficiente entre países.", "Tax", "CFO", "Alto >1M", "Antonio Damián / Jaime Medina / Miguel Valencia / Paola Salvador / Luis Peña", "HROps aparece circulado. Nota adicional: “Contingencia ... trabajo” (parcial); confirmar texto. Solo Tax está marcado en FoP.", "IMG_1641.HEIC (izquierda); IMG_1647.HEIC (fila Transversal, tercera)"], ["TRV-04", "Transversal", "Servicios administrados para la operación de compras", "Proponemos explorar con el área de Compras un modelo de servicios administrados para ejecutar sus procesos de manera consistente y sostener las mejoras de eficiencia. EY puede apoyar la definición y operación del servicio, con un alcance y responsabilidades acordados con el cliente.", "Supply Chain & Operations", "Procurement", "Alto >1M", "Antonio Damián / Levon Kalajdyan / Carolina Herrera", "", "IMG_1641.HEIC (derecha); IMG_1647.HEIC (fila Transversal, cuarta)"], ["TRV-05", "Transversal", "Gobierno de inteligencia artificial y gestión de sus riesgos", "Podemos ayudar a consolidar una visión de las iniciativas de inteligencia artificial y a definir cómo se supervisan sus riesgos. La oportunidad es establecer un modelo de gobierno que dé visibilidad al CISO y a la Dirección de IA sobre los desarrollos, sus responsables y los controles necesarios.", "Risk; Technology", "CISO / Director AI /", "Medio 250K–1M", "Omar Martínez / Eva Gutiérrez", "El Buyer termina con una barra, sin otro texto. AI se conserva como aparece.", "IMG_1642.HEIC (izquierda); IMG_1647.HEIC (fila Transversal, quinta)"], ["TRV-06", "Transversal", "Prueba de concepto para administrar riesgos de trabajo", "Proponemos una prueba de concepto de servicios administrados que permita seguir de principio a fin el proceso de riesgos de trabajo y la gestión de la prima correspondiente. El objetivo sería demostrar su utilidad con Nómina y Recursos Humanos antes de evaluar un servicio de mayor alcance.", "Tax", "Nómina / Recursos Humanos", "Sin marcar", "Luis Peña; Antonio Damián", "Valor sin marcar.", "IMG_1642.HEIC (derecha); IMG_1643.HEIC e IMG_1644.HEIC (izquierda, parcial); IMG_1647.HEIC (fila Transversal, sexta)"], ["TRV-07", "Transporte", "Diagnóstico y estandarización de la nómina", "Podemos ofrecer un diagnóstico de nómina para identificar diferencias en los procesos, riesgos y oportunidades de mejora. El resultado propuesto es una hoja de ruta de estandarización que permita a Recursos Humanos priorizar los ajustes y definir las siguientes iniciativas.", "Tax; Organization & People", "Recursos Humanos", "Sin marcar", "Luis Peña", "Misma tarjeta en IMG_1643 e IMG_1644; se registra una sola vez. Valor sin marcar.", "IMG_1643.HEIC (derecha); IMG_1644.HEIC (derecha); IMG_1647.HEIC (fila Transversal, séptima)"], ["PEN-01", "Por confirmar", "Adecuación de controles ante la reforma de prevención de lavado de dinero", "Proponemos acompañar al área de Cumplimiento en la evaluación de los cambios regulatorios de prevención de lavado de dinero y su impacto en los controles existentes. EY puede apoyar la identificación de brechas y la definición de los ajustes necesarios para atender las nuevas obligaciones.", "Legal & Investigations", "Compliance", "Bajo \u003c250K", "Rodolfo Islas", "División no visible en la foto de detalle. Aparece parcialmente a la izquierda del tablero de Transporte, sin rótulo que confirme su división.", "IMG_1638 2.HEIC; IMG_1647.HEIC (extremo izquierdo, parcial)"]]</script><script>
'use strict';
// Una oportunidad tiene un ID y una división; sus Fields of Play pueden ser varios.
const rows=[...new Map(JSON.parse(document.getElementById('source-data').textContent).map(r=>[r[0],r])).values()];
const fieldNames=r=>[...new Set(r[4].split(';').map(x=>x.trim()).filter(Boolean))];
const fields=[['Strategy & Transformation',['Strategy &','Transformation'],'Strategy'],['Transactions',['Transactions'],'Transactions'],['Customer & Growth',['Customer &','Growth'],'Customer'],['Supply Chain & Operations',['Supply Chain &','Operations'],'Supply Chain'],['Sustainability',['Sustainability'],'Sustainability'],['Cybersecurity',['Cybersecurity'],'Cybersecurity'],['Tax',['Tax'],'Tax'],['Finance',['Finance'],'Finance'],['Risk',['Risk'],'Risk'],['Technology',['Technology'],'Technology'],['Audit & Governance',['Audit &','Governance'],'Audit'],['Legal & Investigations',['Legal &','Investigations'],'Legal'],['Organization & People',['Organization &','People'],'People']];
const allMembers=fields.map(([name])=>rows.filter(r=>fieldNames(r).includes(name)));
let members=allMembers,counts=members.map(x=>x.length),division='';
const max=Math.max(1,...counts);
const viewButtons=[...document.querySelectorAll('[data-view]')];
function setView(value){division=value;const activeRows=division?rows.filter(r=>r[1]===division):rows;members=fields.map(([name])=>activeRows.filter(r=>fieldNames(r).includes(name)));counts=members.map(x=>x.length);document.getElementById('view-total').textContent=activeRows.length;viewButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===division)));}

const radar=document.getElementById('radar');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=6;
function draw(){const mobile=radar.clientWidth<520;const W=Math.max(280,radar.clientWidth),H=radar.clientHeight,cx=W/2,cy=H/2-6,R=Math.max(72,Math.min((H-160)/2,(W-(mobile?130:320))/2)),L=R+(mobile?32:44),n=fields.length;
const point=(i,r)=>[cx+Math.cos(-Math.PI/2+i*2*Math.PI/n)*r,cy+Math.sin(-Math.PI/2+i*2*Math.PI/n)*r];
const points=r=>fields.map((_,i)=>point(i,r).join(',')).join(' ');
const web=Array.from({length:max},(_,j)=>`<polygon points="${points((j+1)*R/max)}" fill="none" stroke="#3d3c25" stroke-opacity="0.8" stroke-width="1"/><text class="radar-tick" x="${cx+6}" y="${cy-(j+1)*R/max+12}">${j+1}</text>`).join('');
const axes=fields.map((_,i)=>{const [x,y]=point(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${i===selected?'#ffe600':'#373627'}" stroke-opacity="${i===selected?0.65:0.8}" stroke-width="${i===selected?1.5:1}"/>`}).join('');
const polygon=fields.map((_,i)=>point(i,R*counts[i]/max).join(',')).join(' ');
const labels=fields.map(([name,full,short],i)=>{const [x,y]=point(i,L);const anchor=mobile?'middle':x>cx+20?'start':x<cx-20?'end':'middle';const lines=mobile?[short]:full;const lineH=mobile?15:18;const start=y-(lines.length-1)*lineH/2;const [px,py]=point(i,R*counts[i]/max);const [tx,ty]=point(i,R);const active=i===selected;return `<a href="#fop=${i}${division?'&amp;division='+encodeURIComponent(division):''}" aria-label="${esc(name)}: ${counts[i]} oportunidades"><title>${esc(name)} · ${counts[i]} oportunidades</title><circle cx="${tx}" cy="${ty}" r="18" fill="transparent"/><circle cx="${px}" cy="${py}" r="${active?7:4}" fill="${counts[i]?'#ffe600':'#5a583c'}" stroke="#080808" stroke-width="2"/><text class="radar-label ${active?'active-label':''}" x="${x}" y="${start}" text-anchor="${anchor}">${lines.map((t,j)=>`<tspan x="${x}" dy="${j?lineH:0}">${esc(t)}</tspan>`).join('')}<tspan class="radar-count" x="${x}" dy="${lineH+2}">${counts[i]}</tspan></text></a>`}).join('');
radar.innerHTML=`<svg class="radar-chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-labelledby="chart-title chart-desc"><title id="chart-title">Cantidad de oportunidades por Field of Play</title><desc id="chart-desc">${fields.map(([name],i)=>`${esc(name)}: ${counts[i]}`).join('; ')}. Selecciona un eje para ver las tarjetas.</desc><defs><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs>${web}${axes}<g class="radar-waves" aria-hidden="true" transform="translate(${cx} ${cy})"><circle class="radar-wave" cx="0" cy="0" r="${R}"/><circle class="radar-wave" cx="0" cy="0" r="${R}"/><circle class="radar-wave" cx="0" cy="0" r="${R}"/></g><polygon points="${polygon}" fill="#ffe600" fill-opacity="0.05" stroke="#ffe600" stroke-opacity="0.4" stroke-width="4" filter="url(#glow)"/><polygon points="${polygon}" fill="#ffe600" fill-opacity="0.13" stroke="#ffe600" stroke-width="2"/>${labels}<text class="radar-tick" x="${cx+7}" y="${cy+15}">0</text></svg>`;}
function show(i){selected=i;const list=members[i];document.getElementById('selected-name').textContent=fields[i][0];document.getElementById('selected-count').textContent=`${list.length} ${list.length===1?'oportunidad marcada':'oportunidades marcadas'} en este Field of Play${division?' · '+division:''}`;
document.getElementById('matches').innerHTML=list.length?list.map(r=>`<details class="match"><summary><div class="meta"><span>${r[0]} · ${esc(r[1])}</span><span>${esc(r[6])}</span></div><h3>${esc(r[2])}</h3><span class="hint">Abrir detalle +</span></summary><div class="match-body"><dl>${[['Oportunidad de negocio',r[3]],['Fields of Play',r[4]],['Buyer',r[5]],['Valor estimado · USD',r[6]],['Socios responsables',r[7]],['Observaciones de lectura',r[8]]].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><a class="more" href="Oportunidades_Grupo_Mexico.html#${r[0]}">Ver tarjeta y fotos de origen →</a><div class="proposal-download"><h3>Propuesta comercial preliminar</h3><p>Borrador editable con alcance, entregables y estructura comercial para revisión del socio.</p><a class="proposal-link" href="propuestas/Propuesta_${r[0]}.pptx" download="Propuesta_${r[0]}.pptx">Descargar propuesta comercial · PowerPoint <span aria-hidden="true">↓</span></a></div></div></details>`).join(''):'<div class="empty">No hay oportunidades con esta casilla marcada en las tarjetas del taller.</div>';draw();}
function applyHash(){const params=new URLSearchParams(location.hash.slice(1));const value=params.get('division')||'';setView(['','Transporte','Minería','Infraestructura','Transversal'].includes(value)?value:'');const next=Number(params.get('fop'));show(params.has('fop')&&Number.isInteger(next)&&next>=0&&next<fields.length?next:selected);}
viewButtons.forEach(button=>button.addEventListener('click',()=>{setView(button.dataset.view);if(!counts[selected])selected=counts.indexOf(Math.max(...counts));const params=new URLSearchParams();params.set('fop',selected);if(division)params.set('division',division);const hash='#'+params.toString();if(location.hash===hash)show(selected);else location.hash=hash;}));
window.addEventListener('hashchange',applyHash);window.addEventListener('resize',draw);applyHash();
</script></body></html>
