name: Publicar Excel actualizado
on:
  push:
    paths:
      - '.github/workflows/publish-opportunity-excel.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Radar_Grupo_Mexico_Completo.xlsx
            .github/workflows/publish-opportunity-excel.yml
          sparse-checkout-cone-mode: false
      - name: Aplicar el Excel preparado
        run: |
          python3 - <<'PYEXCEL'
          from pathlib import Path
          import zipfile,base64,zlib,hashlib
          book=Path('Radar_Grupo_Mexico_Completo.xlsx')
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob(book.read_bytes()) != 'aab4cf47dba00a594d21c3ef79cce99c7476cfb6':
              raise SystemExit('El Excel cambió; se detiene la actualización para conservar los cambios.')
          parts={'xl/worksheets/sheet1.xml': '', 'xl/worksheets/sheet2.xml': ''}
          target=book.with_suffix('.tmp.xlsx')
          with zipfile.ZipFile(book) as source, zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as output:
              for item in source.infolist():
                  data=zlib.decompress(base64.b64decode(parts[item.filename])) if item.filename in parts else source.read(item.filename)
                  output.writestr(item,data)
          if blob(target.read_bytes()) != '226caaaa0635faf28d50a5d7a85272ebb0174fbc':
              raise SystemExit('El archivo generado no coincide con el Excel preparado.')
          target.replace(book)
          PYEXCEL
      - name: Publicar Excel y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Radar_Grupo_Mexico_Completo.xlsx
          git rm .github/workflows/publish-opportunity-excel.yml
          git commit -m 'Actualizar Excel con seguimiento de oportunidades'
          git push origin HEAD:main
